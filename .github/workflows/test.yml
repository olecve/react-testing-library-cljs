name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: DeLaGuardo/setup-clj-kondo@master
        with:
          version: "2026.05.25"

      - uses: DeLaGuardo/setup-clojure@master
        with:
          cli: latest

      - run: npm ci
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm run patrol
      - run: npm test

  example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [reagent-karma-example, node-test-example, re-frame-example]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/${{ matrix.example }}/package-lock.json

      - run: npm ci
      - run: npm run ci
